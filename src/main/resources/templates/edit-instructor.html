<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Bewerk docent</title>
</head>

<body>
<div id="content">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-5">
                            <img src="https://media.istockphoto.com/id/1396814518/vector/image-coming-soon-no-photo-no-thumbnail-image-available-vector-illustration.jpg?s=612x612&w=0&k=20&c=hnh2OZgQGhf0b46-J2z7aHbIWwq8HNlSDaNp2wn_iko="
                                 class="rounded-circle mb-3"
                                 style="width: 140px; height: 140px; object-fit: cover;"
                                 alt="Docent afbeelding">

                            <h1 class="h3">
                                Bewerk docent:
                                <span th:text="${instructor.fullName}"></span>
                            </h1>
                        </div>

                        <form th:action="@{/detail/instructor/save}"
                              method="post"
                              th:object="${instructor}">

                            <input type="hidden" th:field="*{id}"/>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Voornaam</label>
                                    <input type="text" class="form-control" th:field="*{firstName}">
                                    <div class="text-danger small"
                                         th:if="${#fields.hasErrors('firstName')}"
                                         th:errors="*{firstName}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Achternaam</label>
                                    <input type="text" class="form-control" th:field="*{lastName}">
                                    <div class="text-danger small"
                                         th:if="${#fields.hasErrors('lastName')}"
                                         th:errors="*{lastName}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">E-mailadres</label>
                                <input type="email" class="form-control" th:field="*{emailAdress}">
                                <div class="text-danger small"
                                     th:if="${#fields.hasErrors('emailAdress')}"
                                     th:errors="*{emailAdress}"></div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Woonplaats</label>
                                    <input type="text" class="form-control" th:field="*{city}">
                                    <div class="text-danger small"
                                         th:if="${#fields.hasErrors('city')}"
                                         th:errors="*{city}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Telefoonnummer</label>
                                    <input type="text" class="form-control" th:field="*{phoneNumber}">
                                    <div class="text-danger small"
                                         th:if="${#fields.hasErrors('phoneNumber')}"
                                         th:errors="*{phoneNumber}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Vak</label>
                                <input type="text" class="form-control" th:field="*{course}">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Omschrijving</label>
                                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Geboortedatum</label>
                                <input type="date" class="form-control" th:field="*{birthDate}">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Klassen</label>
                                <div th:each="cohort : ${allCohorts}" class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{cohorts}"
                                           th:value="${cohort.id}"
                                           th:id="'cohort-' + ${cohort.id}">

                                    <label class="form-check-label"
                                           th:for="'cohort-' + ${cohort.id}"
                                           th:text="${cohort.name}">
                                    </label>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/}" class="btn btn-outline-secondary">Annuleren</a>
                                <button type="submit" class="btn btn-primary">Opslaan</button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>

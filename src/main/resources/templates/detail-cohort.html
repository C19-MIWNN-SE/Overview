<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::#content})}">
<head><title>Overview cohort</title></head>
<body>
<div id="content">
    <h1 th:text="|Overview van ${cohort.name}|"></h1>
    <h2>Details cohort</h2>
    <ul>
        <li>Naam: <span th:text="${cohort.name}">Naam</span></li>
        <li>Onderwerp: <span th:text="${cohort.subject}">Onderwerp</span></li>
        <li>
            Startdatum:
            <span th:if="${cohort.startDate}" th:text="${cohort.startDate}">Startdatum</span>
            <span th:unless="${cohort.startDate}">onbekend</span>
        </li>
        <li>
            Einddatum:
            <span th:if="${cohort.endDate}" th:text="${cohort.endDate}">Einddatum</span>
            <span th:unless="${cohort.endDate}">onbekend</span>
        </li>
    </ul>

    <h2>Docenten</h2>
    <table>
        <thead>
        <tr>
            <th>Voornaam</th>
            <th>Achternaam</th>
            <th>Profielfoto</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="instructor : ${cohort.instructors}">
            <td th:text="${instructor.firstName}"></td>
            <td th:text="${instructor.lastName}"></td>
            <td>
                <a th:href="@{/detail/instructor/{id}(id=${instructor.id})}">
                    <img src="https://media.istockphoto.com/id/1396814518/vector/image-coming-soon-no-photo-no-thumbnail-image-available-vector-illustration.jpg?s=612x612&w=0&k=20&c=hnh2OZgQGhf0b46-J2z7aHbIWwq8HNlSDaNp2wn_iko="
                         alt="Afbeelding"
                         style="width: 175px; height: 175px;">
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <h2>Deelnemers</h2>
    <table>
        <thead>
        <tr>
            <th>Voornaam</th>
            <th>Achternaam</th>
            <th>Profielfoto</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="participant : ${cohort.participants}">
            <td th:text="${participant.firstName}"></td>
            <td th:text="${participant.lastName}"></td>
            <td>
                <a th:href="@{/detail/participant/{id}(id=${participant.id})}">
                    <img src="https://media.istockphoto.com/id/1396814518/vector/image-coming-soon-no-photo-no-thumbnail-image-available-vector-illustration.jpg?s=612x612&w=0&k=20&c=hnh2OZgQGhf0b46-J2z7aHbIWwq8HNlSDaNp2wn_iko="
                         alt="Afbeelding"
                         style="width: 175px; height: 175px;">
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <form th:action="@{/cohort/delete/{id}(id=${cohort.id})}" method="post">
        <button type="submit">Verwijder Cohort</button>
    </form>
</div>
</body>
</html>

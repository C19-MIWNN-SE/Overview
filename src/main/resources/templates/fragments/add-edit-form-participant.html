<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="form(title, formAction, object, allCohorts)">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-5">
                            <div class="about-photo">
                                <img
                                        th:src="${participant.image != null} ? @{/images/{id}(id=${participant.image.id})} : 'https://media.istockphoto.com/id/1396814518/vector/image-coming-soon-no-photo-no-thumbnail-image-available-vector-illustration.jpg?s=612x612&w=0&k=20&c=hnh2OZgQGhf0b46-J2z7aHbIWwq8HNlSDaNp2wn_iko='"
                                        class="rounded-circle mb-3"
                                        th:alt="|Foto van ${participant.fullName}|"
                                >
                            </div>

                            <h1 class="h3" th:text="${title}"></h1>
                        </div>

                        <form th:action="${formAction}"
                              method="post"
                              th:object="${participant}"
                              enctype="multipart/form-data">

                            <input type="hidden" th:field="*{id}"/>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Voornaam</label>
                                    <input type="text" class="form-control" th:field="*{firstName}">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Achternaam</label>
                                    <input type="text" class="form-control" th:field="*{lastName}">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">E-mailadres</label>
                                <input type="email" class="form-control" th:field="*{emailAdress}">
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Woonplaats</label>
                                    <input type="text" class="form-control" th:field="*{city}">
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label">Telefoonnummer</label>
                                    <input type="text" class="form-control" th:field="*{phoneNumber}">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Omschrijving</label>
                                <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Geboortedatum</label>
                                <input type="date" class="form-control" th:field="*{birthDate}">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Werkgever</label>
                                <input type="text" class="form-control" th:field="*{employer}">
                            </div>

                            <div class="mb-4" sec:authorize="hasRole('ROLE_INSTRUCTOR')">
                                <label class="form-label">Klassen</label>
                                <div th:each="cohort : ${allCohorts}" class="form-check">
                                    <input class="form-check-input"
                                           type="checkbox"
                                           th:field="*{cohorts}"
                                           th:value="${cohort.id}"
                                           th:id="'cohort-' + ${cohort.id}">

                                    <label class="form-check-label"
                                           th:for="'cohort-' + ${cohort.id}"
                                           th:text="${cohort.name}">
                                    </label>
                                </div>
                            </div>

                            <div class="mb-4" th:classappend="*{image == null} ? 'd-none' : ''">
                                <label class="form-label">Huidige foto</label>
                                <div>
                                    <img th:src="${participant.image != null} ? @{/images/{id}(id=${participant.image.id})} : ''"
                                         th:alt="|Foto van ${participant.fullName}|"
                                         class="img-thumbnail" style="max-height: 100px;">
                                </div>
                                <div class="form-check mt-2">
                                    <input type="checkbox" id="deleteImage" name="deleteImage" value="true" class="form-check-input">
                                    <label for="deleteImage" class="form-check-label">Foto verwijderen</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="imageFile" class="form-label"
                                       th:text="*{image != null} ? 'Nieuwe foto uploaden' : 'Profielfoto'"></label>
                                <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*">
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/}" class="btn btn-outline-secondary">Annuleren</a>
                                <button type="submit" class="btn btn-primary">Opslaan</button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${title}, ~{::#content})}">
<div id="content">
    <h1 th:text="${title}">Cohorten</h1>

    <div class="container">
        <div class="row">
            <div class="col-12 mb-3 mb-lg-5">

                <div class="overflow-hidden card table-nowrap table-card">

                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="me-auto p-2">Cohorten</h5>

                            <form th:action="@{/detail/participant/add}" method="get">
                                <button type="submit" class="p-2 btn btn-primary btn-sm">
                                    + Nieuwe deelnemer
                                </button>
                            </form>

                            <form th:action="@{/detail/instructor/add}" method="get">
                                <button type="submit" class="p-2 m-2 btn btn-primary btn-sm">
                                    + Nieuwe docent
                                </button>
                            </form>

                            <a th:href="@{/cohort/add}" class="p-2 btn btn-primary btn-sm">
                                + Nieuw cohort
                            </a>
                    </div>

                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead class="small text-uppercase bg-body text-muted">
                            <tr>
                                <th>Cohort</th>
                                <th>Onderwerp</th>
                                <th>Startdatum</th>
                                <th class="pe-0" >Einddatum</th>
                                <th class="py-0" style="width: 1px"></th>
                                <th class="py-0" style="width: 1px"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr class="align-middle" th:each="cohort : ${allCohorts}">
                                <td>
                                    <a th:href="@{/cohort/{id}(id=${cohort.id})}" th:text="${cohort.name}">Cohort</a>
                                </td>

                                <td th:text="${cohort.subject}">Onderwerp</td>
                                <td>
                                    <span th:if="${cohort.startDate}" th:text="${cohort.startDate}">Startdatum</span>
                                    <span th:unless="${cohort.startDate}">onbekend</span>
                                </td>
                                <td class="pe-0">
                                    <span th:if="${cohort.endDate}" th:text="${cohort.endDate}">Einddatum</span>
                                    <span th:unless="${cohort.endDate}">onbekend</span>
                                </td>
                                <td class="p-0" style="width: 1px">
                                    <form th:action="@{/cohort/edit/{id}(id=${cohort.id})}" method="get">
                                        <button type="submit" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                    </form>
                                </td>
                                <td class="py-0" style="width: 1px">
                                    <button type="button"
                                            class="btn btn-sm btn-outline-danger"
                                            data-bs-toggle="modal"
                                            data-bs-target="#deleteCohort"
                                            th:data-cohort-id="${cohort.id}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteCohort"
         tabindex="-1"
         aria-labelledby="deleteCohortModalLabel"
         aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="deleteCohortModalLabel">
                        Cohort verwijderen
                    </h5>
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Sluiten"></button>
                </div>

                <div class="modal-body">
                    Weet je zeker dat je dit cohort wilt verwijderen?
                </div>

                <div class="modal-footer">
                    <form method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="btn btn-warning">Ja</button>
                    </form>

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                        Nee
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const deleteCohortModal = document.getElementById('deleteCohort');
        deleteCohortModal.addEventListener('show.bs.modal', (event) => {
            const button = event.relatedTarget;
            const cohortId = button.getAttribute('data-cohort-id');
            const form = deleteCohortModal.querySelector('form');
            form.action = `/cohort/delete/${cohortId}`;
        });
    </script>

</div>
</html>

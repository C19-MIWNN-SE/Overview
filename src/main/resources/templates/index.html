<!DOCTYPE html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/general :: head(~{:: title})}">
    <title>Inloggen</title>
</head>

<body>
<h5 class="text-center mb-2">Overview</h5>
<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card p-4 shadow" style="width: 300px;">

        <h2 class="text-center mb-3">Inloggen</h2>

        <div th:if="${param.error}" class="alert alert-danger">
            Gebruikersnaam of wachtwoord klopt niet
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            Je bent uitgelogd
        </div>

        <form th:action="@{/login}" method="post">

            <div class="mb-2">
                <input class="form-control" type="text" name="username" placeholder="Gebruikersnaam" required>
            </div>

            <div class="mb-3">
                <input class="form-control" type="password" name="password" placeholder="Wachtwoord" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">
                Log in
            </button>

        </form>

    </div>

</div>

</body>
</html>
